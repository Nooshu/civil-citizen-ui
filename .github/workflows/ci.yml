name: CI

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master
      - refs/tags/*
    tags:
      - '*'

env:
  CI: true
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  pii-log-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install Semgrep
        run: python -m pip install semgrep==1.136.0
      - name: Test PII logging rules
        run: semgrep test .semgrep
      - name: Scan changed application code for PII logging
        env:
          SEMGREP_BASELINE_COMMIT: ${{ github.event.pull_request.base.sha }}
        run: |
          semgrep scan --strict --metrics=off --no-rewrite-rule-ids \
            --config .semgrep/logging-pii.yml \
            --json-output semgrep-results.json \
            src/main
          python .semgrep/annotate.py semgrep-results.json

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Install
        env:
          # Re-check lockfile resolutions against the registry (lockfile poisoning).
          YARN_ENABLE_HARDENED_MODE: '1'
        run: yarn install
      - name: Check exact pins and lockfile SHA checksums
        run: yarn deps:check
      - name: Audit npm advisories
        run: yarn deps:audit
      - name: Build
        run: yarn build
      - name: Coverage (Renovate)
        if: github.event_name == 'pull_request' && (github.actor == 'renovate[bot]' || startsWith(github.head_ref, 'renovate/'))
        run: yarn test:coverage
      - name: Pull WireMock mappings
        run: yarn wiremock:pull
