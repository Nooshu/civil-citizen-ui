# Yarn 4. Checksums are SHA-512 of each resolved npm archive (yarn.lock `checksum:`).
# Throw if a downloaded tarball does not match the lockfile hash (supply-chain / mirror swap).
checksumBehavior: throw

compressionLevel: mixed

enableGlobalCache: false

enableImmutableInstalls: true

nodeLinker: node-modules

# 7 × 24 × 60 minutes. Yarn will not select a version published fewer than 7 days
# ago when resolving (yarn add / yarn up). npm can still unpublish very new
# releases; waiting also reduces the chance of installing a compromised package
# that has not yet been reported. Security exceptions: set
# YARN_NPM_MINIMAL_AGE_GATE=0 for that command only (see AGENTS.md).
npmMinimalAgeGate: 10080

yarnPath: .yarn/releases/yarn-4.10.3.cjs
