services:
  wiremock:
    image: wiremock/wiremock:3.9.1
    ports:
      - "1111:8080"
    volumes:
      # WireMock loads mappings recursively, so preview-only stubs are the mappings root
      # and the validated chart contracts are nested inside it. Preview stubs stay out of
      # charts/ so they are never packaged into the Jenkins reduced-stack contract set,
      # which forbids broad matchers (see docs/reduced-stack-wiremock-contracts.md).
      # The nested mountpoint must already exist because the parent bind is read-only.
      - ./ui-preview-mappings:/home/wiremock/mappings:ro
      - ../charts/civil-citizen-ui/wiremock/mappings:/home/wiremock/mappings/reduced-stack:ro
      - ../charts/civil-citizen-ui/wiremock/__files:/home/wiremock/__files:ro
    command: ["--global-response-templating", "--disable-gzip", "--verbose"]

  citizen-ui:
    build:
      context: ..
      dockerfile: Dockerfile.ui-preview
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: e2eTest
      PORT: "3001"
      CIVIL_SERVICE_URL: http://wiremock:8080
      ORDNANCE_SURVEY_API_URL: http://wiremock:8080
      ORDNANCE_SURVEY_API_KEY: mock-key
      LOG_LEVEL: INFO
      APPINSIGHTS_KEY: ""
    depends_on:
      - wiremock
